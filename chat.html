<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiPet chat</title>
    <link rel="stylesheet" href="/src/chat.css" />
  </head>
  <body>
    <header>
      <strong id="title">Talk to pet</strong>
      <span id="meta">Pet chat · OS helpers</span>
      <button type="button" id="close">Close</button>
    </header>
    <p id="status">The pet answers with the helpers you picked at setup.</p>
    <section id="mcp-panel" hidden>
      <h2 id="mcp-heading">Helper tools (MCP)</h2>
      <p id="mcp-intro">
        MIT / Apache-2.0 tools for your platform. Tick what to load. If you mark more than one, each license applies on its own.
      </p>
      <div id="mcp-list"></div>
      <aside id="mcp-license" class="license-note"></aside>
      <div class="mcp-actions">
        <button type="button" id="mcp-save">Load selected</button>
        <button type="button" id="mcp-skip" class="ghost">Skip for now</button>
      </div>
    </section>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" rows="3" maxlength="240" placeholder="Say something…" autocomplete="off"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
