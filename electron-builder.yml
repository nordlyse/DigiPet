appId: com.nordlyse.digipet
productName: DigiPet
copyright: Copyright 2026 Jakob Lyse. MIT License.
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - assets/**/*
  - package.json
  - LICENSE
  - "!**/node_modules/**"
asarUnpack:
  - "**/*.wasm"
electronLanguages:
  - en
  - tr
  - nb
  - nn
  - no
extraResources:
  - from: native
    to: native
    filter:
      - list-windows
      - list-windows.c
      - calendar
      - calendar.m
      - digipet-engine
      - digipet-engine.exe
mac:
  category: public.app-category.entertainment
  icon: build/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSCalendarsUsageDescription: DigiPet reads and adds calendar events when you ask in chat.
    NSCalendarsFullAccessUsageDescription: DigiPet reads upcoming meetings and adds events you ask for in chat.
    NSAppleEventsUsageDescription: DigiPet talks to Mail and Messages when those helpers are on.
    CFBundleDevelopmentRegion: en
    CFBundleLocalizations:
      - en
      - tr
      - nb
      - nn
      - no
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - zip
    - nsis
linux:
  icon: build/icon.png
  category: Game
  synopsis: Desktop pets that live on your screen
  maintainer: Jakob Lyse <jakob.lyse@gmail.com>
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DigiPet
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  installerLanguages:
    - en_US
    - tr_TR
    - nb_NO
dmg:
  icon: build/icon.png
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
