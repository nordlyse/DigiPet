<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiPet sohbet</title>
    <link rel="stylesheet" href="/src/chat.css" />
  </head>
  <body>
    <header>
      <strong id="title">Pet ile konuş</strong>
      <span id="meta">Candle · SmolLM2-135M · MCP</span>
      <button type="button" id="close">Kapat</button>
    </header>
    <p id="status">Rust motoru ilk seferde modeli indirir, sonra çevrimdışı çalışır.</p>
    <section id="mcp-panel" hidden>
      <h2>Yardımcı araçlar (MCP)</h2>
      <p>
        Platformuna göre MIT / Apache-2.0 araçlar. İstediğine çarpı at, sonra yükle. Pet bunları sohbette çağırır
        (hava, mail, takvim, uygulama, mesaj).
      </p>
      <div id="mcp-list"></div>
      <div class="mcp-actions">
        <button type="button" id="mcp-save">Seçilenleri yükle</button>
        <button type="button" id="mcp-skip" class="ghost">Şimdilik geç</button>
      </div>
    </section>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" maxlength="240" placeholder="Bir şey söyle…" autocomplete="off" />
      <button type="submit" id="send">Gönder</button>
    </form>
    <script type="module" src="/src/chat.ts"></script>
  </body>
</html>
