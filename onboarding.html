<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DigiPet</title>
    <link rel="stylesheet" href="/src/onboarding.css" />
  </head>
  <body>
    <main id="step-pet">
      <header>
        <h1>DigiPet</h1>
        <p>Pick the animal that will live on your desktop. You can change it later from the menu bar 🐾. The pet climbs the real windows you open.</p>
      </header>
      <section class="stage">
        <canvas id="preview"></canvas>
        <p id="blurb"></p>
      </section>
      <div id="grid" class="pet-grid"></div>
      <button type="button" id="next">Devam — ajanları seç</button>
    </main>
    <main id="step-mcp" hidden>
      <header>
        <h1 id="mcp-title">Ajanlar</h1>
        <p id="mcp-lead">
          Bu işletim sistemine özel yardımcıları seç. Pet sohbette hava, mail, takvim, uygulama ve mesaj için yalnızca işaretlediklerini kullanır.
        </p>
      </header>
      <div id="mcp-list"></div>
      <aside id="license-note" class="license-note"></aside>
      <div class="mcp-actions">
        <button type="button" id="mcp-back" class="ghost">Geri</button>
        <button type="button" id="mcp-skip" class="ghost">Ajan yükleme</button>
        <button type="button" id="go">Seçilenlerle başla</button>
      </div>
    </main>
    <script type="module" src="/src/onboarding.ts"></script>
  </body>
</html>
