[package]
name = "digipet-engine"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Local Candle LLM host with in-process MIT MCP tools for DigiPet"

[[bin]]
name = "digipet-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
hf-hub = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.21"
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2"

[profile.release]
lto = false
codegen-units = 16
